{% extends 'lost_and_found/base.html' %}
{% block title %}Delete {{ item.title }} — Campus Lost & Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm rounded-4">
      <div class="card-body p-4 p-md-5 text-center">
        <i class="bi bi-exclamation-triangle-fill text-danger display-4"></i>
        <h3 class="fw-700 mt-3">Delete this report?</h3>
        <p class="text-muted">This will permanently remove <strong>{{ item.title }}</strong> and any related claim requests.</p>
        <form method="post" class="d-flex justify-content-center gap-3 mt-4">
          {% csrf_token %}
          <a href="{% url 'item_detail' item.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
          <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-1"></i>Delete Report</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
