services:
  mongodb:
    image: mongo:8.0
    container_name: campus-lnf-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: campus_app
      MONGO_INITDB_ROOT_PASSWORD: change-this-local-password
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username campus_app --password change-this-local-password --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
